spring.application.name=WarrantyWallet
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./warrantywalletdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
warrantywallet.upload-dir=${UPLOAD_DIR:./uploads/receipts}
warrantywallet.reminders.enabled=${REMINDERS_ENABLED:true}
