<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register product | WarrantyWallet</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments :: nav}"></header>
<main class="container narrow-shell"><a class="back-link" th:href="@{/}">← Back to products</a>
<div class="form-heading"><span class="eyebrow">HOUSEHOLD WALLET</span><h1>Register a product</h1><p>Enter purchase details. Warranty expiry is calculated automatically.</p></div>
<div class="form-card">
<form th:action="@{/warranties}" th:object="${form}" method="post" enctype="multipart/form-data">
<div class="form-error-summary" th:if="${#fields.hasGlobalErrors()}"><strong>We couldn't save this product:</strong><p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div>
<div class="mb-3"><label class="form-label" for="productName">Product name *</label><input id="productName" class="form-control" th:field="*{productName}" placeholder="e.g. Washing machine" maxlength="110" required><div class="field-error" th:if="${#fields.hasErrors('productName')}" th:errors="*{productName}"></div></div>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="brand">Brand</label><input id="brand" class="form-control" th:field="*{brand}" placeholder="e.g. LG"></div>
<div class="col-md-6 mb-3"><label class="form-label" for="category">Category *</label><select id="category" class="form-select" th:field="*{category}" required><option value="">Choose category</option><option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option></select><div class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div></div></div>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="purchaseDate">Purchase date *</label><input id="purchaseDate" class="form-control" type="date" th:field="*{purchaseDate}" required><div class="field-error" th:if="${#fields.hasErrors('purchaseDate')}" th:errors="*{purchaseDate}"></div></div>
<div class="col-md-6 mb-3"><label class="form-label" for="warrantyMonths">Warranty duration (months) *</label><input id="warrantyMonths" class="form-control" type="number" min="1" max="120" th:field="*{warrantyMonths}" required><div class="field-error" th:if="${#fields.hasErrors('warrantyMonths')}" th:errors="*{warrantyMonths}"></div></div></div>
<div class="expiry-preview" id="expiryPreview">Calculated expiry: <strong>Choose a purchase date and duration</strong></div>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="serialNumber">Serial number</label><input id="serialNumber" class="form-control" th:field="*{serialNumber}" placeholder="Optional"></div>
<div class="col-md-6 mb-3"><label class="form-label" for="storeName">Purchased from</label><input id="storeName" class="form-control" th:field="*{storeName}" placeholder="Store or website"></div></div>
<div class="mb-3"><label class="form-label" for="receipt">Purchase receipt (PDF, JPG or PNG)</label><input id="receipt" class="form-control" name="receipt" type="file" accept=".pdf,.jpg,.jpeg,.png"><small class="form-help">Optional · Maximum 8 MB.</small></div>
<div class="mb-4"><label class="form-label" for="notes">Notes</label><textarea id="notes" class="form-control" rows="3" th:field="*{notes}" placeholder="Useful product or warranty details"></textarea></div>
<div class="form-actions"><a class="btn btn-light" th:href="@{/}">Cancel</a><button class="btn btn-dark" type="submit">Save product</button></div>
</form></div></main>
<footer class="footer"><div class="container">WarrantyWallet</div></footer>
<script>
(function(){
 const purchase=document.getElementById('purchaseDate'), months=document.getElementById('warrantyMonths'), preview=document.getElementById('expiryPreview');
 function update(){
  if(!purchase.value||!months.value){preview.innerHTML='Calculated expiry: <strong>Choose a purchase date and duration</strong>';return;}
  const parts=purchase.value.split('-').map(Number);
  const date=new Date(parts[0],parts[1]-1,parts[2],12);
  const originalDay=date.getDate();
  date.setMonth(date.getMonth()+Number(months.value));
  if(date.getDate()<originalDay) date.setDate(0);
  preview.innerHTML='Calculated expiry: <strong>'+date.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+'</strong>';
 }
 purchase.addEventListener('change',update); months.addEventListener('input',update); update();
})();
</script></body></html>
